services:
  - type: web
    name: edumanage-crm
    runtime: node
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      # Saytlar analitikasi: saytlarga beriladigan tracking kodi shu manzilga
      # ulanadi (backend'ning ommaviy manzili). Domen o'zgarsa — shu yerda yangilang.
      - key: WA_PUBLIC_URL
        value: https://ufq-crm-fxh5.onrender.com
      - key: MONGODB_URI
        sync: false
      # Davomat boti — ota-onalar guruhiga hisobot va qarzdorlik xabarnomasi
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      # SMS (Eskiz.uz) — qarzdorga telefon orqali xabar
      - key: ESKIZ_EMAIL
        sync: false
      - key: ESKIZ_PASSWORD
        sync: false
      - key: ESKIZ_FROM
        value: "4546"
      - key: ANTHROPIC_API_KEY
        sync: false
      # AI "Eshitish" — Microsoft neyron ovozi (uz-UZ-MadinaNeural): eng tez va sifatli.
      # AZURE_SPEECH_REGION ixtiyoriy — yozilmasa server hududni o'zi aniqlaydi.
      - key: AZURE_SPEECH_KEY
        sync: false
      - key: AZURE_SPEECH_REGION
        sync: false
      # AI chat, «Eshitish» (tabiiy o'zbekcha ovoz) va ovozli xabarlarni
      # matnga o'girish — ASOSIY kalit. Usiz ovoz ishlamaydi.
      - key: LOVABLE_API_KEY
        sync: false
      # Ixtiyoriy: Google Gemini (AI va o'zbekcha ovoz uchun zaxira)
      - key: GEMINI_API_KEY
        sync: false

      # ─── XAVFSIZLIK (majburiy) ─────────────────────────────────────────
      # Sessiya tokenlarini imzolash kaliti. Render uni O'ZI generatsiya
      # qiladi. ⚠️ Bu qiymatni almashtirish barcha sessiyalarni yopadi.
      - key: AUTH_SECRET
        generateValue: true

      # Portallar qaysi domenlardan kelishi mumkin (vergul bilan).
      # Backend portallarni o'zi bersa (bitta domen) — bo'sh qoldirish mumkin.
      # Vercel ishlatilsa: https://admin.example.com,https://mentor.example.com
      # Pastki domenlar uchun: *.vercel.app
      - key: ALLOWED_ORIGINS
        sync: false

      # Portallar BOSHQA domenda bo'lsa 1 qiling (cookie SameSite=None; Secure).
      - key: CROSS_SITE_AUTH
        value: "0"

      # Birinchi admin paroli. Bo'sh qoldirilsa server tasodifiy parol
      # generatsiya qilib LOGGA bir marta chiqaradi.
      - key: BOOTSTRAP_ADMIN_USER
        value: admin
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false

      # ─── ADMIN VA SUPER ADMIN HISOBLARI ────────────────────────────────
      # Parollar kodda ham, gitda ham yo'q — faqat shu yerda (Render →
      # Environment). Parol QIYMATI O'ZGARGANDA serverning keyingi ishga
      # tushishida bir marta qo'llanadi; panelda o'zgartirilgan parol
      # restartda qaytib ketmaydi. Namunaviy parolni almashtirish yoki Super
      # Admin hisobini tiklash uchun — shu qiymatni yangisiga o'zgartiring.
      - key: ADMIN_LOGIN
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: SUPER_ADMIN_LOGIN
        value: Abdulfozil
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      # Super Admin sessiyasi necha soniya harakatsizlikdan keyin yopiladi
      - key: SUPER_ADMIN_IDLE_TIMEOUT
        value: "7200"

      # Eski (xeshlanmagan) parollar bilan kirishga ruxsat. Barcha foydalanuvchi
      # bir marta kirib bo'lgach 0 ga o'zgartiring — o'shanda parollar
      # to'liq scrypt'ga ko'chgan bo'ladi.
      - key: ALLOW_LEGACY_PASSWORDS
        value: "1"

      # ─── QURILMA BLOKI (brute-force) ───────────────────────────────────
      # Parol necha marta xato kiritilsa QURILMA bloklanadi va necha soniya
      # bloklangan turadi. Blok IP/Wi-Fi ga emas, aynan qurilmaga qo'yiladi:
      # bitta o'quv markazida hamma bitta internetdan chiqadi, IP bo'yicha
      # bloklash butun binoni tizimdan uzib qo'yardi.
      - key: DEVICE_MAX_FAILED_ATTEMPTS
        value: "8"
      - key: DEVICE_BLOCK_SECONDS
        value: "900"
      # Hisobning O'ZINI bloklash — o'chiq. Yoqilsa, begona odam sizning
      # loginingiz bilan xato parol yozib sizni tizimdan uzib qo'ya olardi.
      - key: LOCK_ACCOUNT_ON_FAILURES
        value: "0"

      # ─── PAROL SIYOSATI ────────────────────────────────────────────────
      # Kim o'z parolini almashtira oladi. Sukut: faqat admin (admin
      # panelidagi Sozlamalar bo'limidan). Mentor/talaba parolini admin
      # tiklaydi — portalning o'zidan almashtirish yo'q.
      - key: SELF_PASSWORD_CHANGE_ROLES
        value: "admin"
